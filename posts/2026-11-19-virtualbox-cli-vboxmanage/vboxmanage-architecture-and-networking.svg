<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="580" viewBox="0 0 1080 580" role="img" aria-labelledby="title-vbox-arch desc-vbox-arch">
  <title id="title-vbox-arch">VBoxManage Architecture: Offline Config vs. Live Runtime &amp; NAT Forwarding</title>
  <desc id="desc-vbox-arch">Architecture diagram illustrating how VBoxManage separates offline configuration commands (modifyvm, storagectl, createmedium) when powered off from live runtime commands (controlvm, snapshot) when running, and how NAT port forwarding maps host 127.0.0.1:2222 to guest 10.0.2.15:22.</desc>

  <defs>
    <style>
      .font-sans { font-family: Inter, 'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0d9488" />
    </marker>
    <marker id="arrow-sky" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="1080" height="580" rx="16" fill="#f8fafc" />
  <rect x="1" y="1" width="1078" height="578" rx="15" fill="none" stroke="#e2e8f0" stroke-width="2" />

  <!-- Top Header -->
  <text x="40" y="42" class="font-mono" font-size="12" font-weight="600" fill="#0f766e" letter-spacing="0.08em">// VBOXMANAGE MENTAL MODEL</text>
  <text x="40" y="70" class="font-sans" font-size="22" font-weight="700" fill="#0f172a">Offline Mutation (modifyvm) vs. Live Control (controlvm) &amp; NAT Path</text>

  <!-- ========================================================= -->
  <!-- LEFT COLUMN: CLI Planes & Host SSH Client                 -->
  <!-- ========================================================= -->

  <!-- Card 1: Offline Configuration (VM Powered Off) -->
  <rect x="40" y="98" width="340" height="148" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="1.75" />
  <rect x="40" y="98" width="340" height="38" rx="12" fill="#fffbeb" />
  <rect x="40" y="124" width="340" height="12" fill="#fffbeb" />
  <line x1="40" y1="136" x2="380" y2="136" stroke="#fde68a" stroke-width="1.25" />
  <text x="58" y="122" class="font-sans" font-size="13.5" font-weight="700" fill="#92400e">1. Offline Config (State: poweroff)</text>

  <rect x="58" y="148" width="304" height="54" rx="7" fill="#0f172a" />
  <text x="72" y="169" class="font-mono" font-size="11" font-weight="700" fill="#fcd34d">VBoxManage modifyvm "$VM" ...</text>
  <text x="72" y="189" class="font-mono" font-size="10" fill="#cbd5e1">createvm · storagectl · createmedium</text>
  <text x="210" y="226" text-anchor="middle" class="font-sans" font-size="11.5" fill="#475569">Mutates persistent XML .vbox hardware spec</text>

  <!-- Card 2: Live Runtime Control (VM Running) -->
  <rect x="40" y="264" width="340" height="148" rx="12" fill="#ffffff" stroke="#0d9488" stroke-width="1.75" />
  <rect x="40" y="264" width="340" height="38" rx="12" fill="#f0fdfa" />
  <rect x="40" y="290" width="340" height="12" fill="#f0fdfa" />
  <line x1="40" y1="302" x2="380" y2="302" stroke="#99f6e4" stroke-width="1.25" />
  <text x="58" y="288" class="font-sans" font-size="13.5" font-weight="700" fill="#0f766e">2. Live Runtime (State: running)</text>

  <rect x="58" y="314" width="304" height="54" rx="7" fill="#0f172a" />
  <text x="72" y="335" class="font-mono" font-size="11" font-weight="700" fill="#5eead4">VBoxManage controlvm "$VM" ...</text>
  <text x="72" y="355" class="font-mono" font-size="10" fill="#cbd5e1">natpf1 · acpipowerbutton · savestate</text>
  <text x="210" y="392" text-anchor="middle" class="font-sans" font-size="11.5" fill="#475569">Signals active VBoxHeadless / GUI process</text>

  <!-- Card 3: Host SSH / HTTP Client -->
  <rect x="40" y="430" width="340" height="114" rx="12" fill="#ffffff" stroke="#0284c7" stroke-width="1.75" />
  <rect x="40" y="430" width="340" height="36" rx="12" fill="#f0f9ff" />
  <rect x="40" y="454" width="340" height="12" fill="#f0f9ff" />
  <line x1="40" y1="466" x2="380" y2="466" stroke="#bae6fd" stroke-width="1.25" />
  <text x="58" y="453" class="font-sans" font-size="13.5" font-weight="700" fill="#0369a1">3. Host Loopback Traffic</text>

  <rect x="58" y="478" width="304" height="50" rx="7" fill="#0f172a" />
  <text x="210" y="500" text-anchor="middle" class="font-mono" font-size="11.5" font-weight="700" fill="#38bdf8">$ ssh -p 2222 user@127.0.0.1</text>
  <text x="210" y="518" text-anchor="middle" class="font-mono" font-size="9.5" fill="#94a3b8">Localhost only (isolated from Wi-Fi/LAN)</text>

  <!-- Arrows from Left Cards to Right VirtualBox Engine -->
  <line x1="380" y1="172" x2="424" y2="172" stroke="#d97706" stroke-width="2.25" marker-end="url(#arrow-amber)" />
  <line x1="380" y1="338" x2="424" y2="338" stroke="#0d9488" stroke-width="2.25" marker-end="url(#arrow-teal)" />
  <line x1="380" y1="496" x2="424" y2="496" stroke="#0284c7" stroke-width="2.25" marker-end="url(#arrow-sky)" />

  <!-- ========================================================= -->
  <!-- RIGHT PANEL: VirtualBox Engine (VBoxSVC + Guest VM)       -->
  <!-- ========================================================= -->
  <rect x="432" y="98" width="608" height="446" rx="12" fill="#ffffff" stroke="#0d9488" stroke-width="2" />
  <rect x="432" y="98" width="608" height="40" rx="12" fill="#f0fdfa" />
  <rect x="432" y="126" width="608" height="12" fill="#f0fdfa" />
  <line x1="432" y1="138" x2="1040" y2="138" stroke="#99f6e4" stroke-width="1.5" />
  <text x="454" y="123" class="font-sans" font-size="14.5" font-weight="700" fill="#0f766e">Oracle VirtualBox Hypervisor (VBoxSVC &amp; VBoxHeadless)</text>
  <rect x="868" y="107" width="152" height="22" rx="11" fill="#ccfbf1" stroke="#14b8a6" />
  <text x="944" y="122" text-anchor="middle" class="font-mono" font-size="10.5" font-weight="600" fill="#115e59">~/VirtualBox VMs/</text>

  <!-- Machine Definition Strip -->
  <rect x="454" y="152" width="564" height="44" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5" />
  <text x="472" y="172" class="font-mono" font-size="11.5" font-weight="700" fill="#92400e">myvm.vbox (Machine Registry &amp; Virtual Hardware Spec)</text>
  <text x="472" y="188" class="font-mono" font-size="10" fill="#b45309">Ubuntu_64 · 2 vCPUs · 4096 MB RAM · IOAPIC=on · VMSVGA (16 MB)</text>

  <!-- Guest VM Box -->
  <rect x="454" y="210" width="564" height="220" rx="10" fill="#f8fafc" stroke="#14b8a6" stroke-width="1.75" />
  <rect x="454" y="210" width="564" height="30" rx="10" fill="#0f766e" />
  <rect x="454" y="230" width="564" height="10" fill="#0f766e" />
  <text x="736" y="230" text-anchor="middle" class="font-mono" font-size="12" font-weight="700" fill="#ffffff">Guest VM: "myvm" (Ubuntu 24.04 LTS · Headless Process)</text>

  <!-- Inside Guest Left: Storage Subsystem -->
  <rect x="472" y="254" width="256" height="158" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="600" y="276" text-anchor="middle" class="font-sans" font-size="12.5" font-weight="700" fill="#0f172a">SATA Controller (IntelAhci)</text>
  <line x1="486" y1="286" x2="714" y2="286" stroke="#e2e8f0" />

  <rect x="486" y="298" width="228" height="46" rx="6" fill="#ecfdf5" stroke="#6ee7b7" />
  <text x="600" y="317" text-anchor="middle" class="font-mono" font-size="10.5" font-weight="700" fill="#065f46">Port 0 (hdd): myvm.vdi</text>
  <text x="600" y="334" text-anchor="middle" class="font-mono" font-size="9.5" fill="#047857">40 GB Dynamic VDI (Boot #2)</text>

  <rect x="486" y="354" width="228" height="46" rx="6" fill="#f1f5f9" stroke="#cbd5e1" />
  <text x="600" y="373" text-anchor="middle" class="font-mono" font-size="10.5" font-weight="600" fill="#334155">Port 1 (dvddrive): os.iso</text>
  <text x="600" y="390" text-anchor="middle" class="font-mono" font-size="9.5" fill="#64748b">Eject → --medium emptydrive</text>

  <!-- Inside Guest Right: Guest OS & Network Stack -->
  <rect x="744" y="254" width="256" height="158" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="872" y="276" text-anchor="middle" class="font-sans" font-size="12.5" font-weight="700" fill="#0f172a">Paravirtualized NIC1 (virtio)</text>
  <line x1="758" y1="286" x2="986" y2="286" stroke="#e2e8f0" />

  <rect x="758" y="298" width="228" height="46" rx="6" fill="#e0f2fe" stroke="#7dd3fc" />
  <text x="872" y="317" text-anchor="middle" class="font-mono" font-size="10.5" font-weight="700" fill="#0369a1">Guest DHCP IP: 10.0.2.15</text>
  <text x="872" y="334" text-anchor="middle" class="font-mono" font-size="9.5" fill="#0284c7">sshd listening on 0.0.0.0:22</text>

  <rect x="758" y="354" width="228" height="46" rx="6" fill="#f0fdfa" stroke="#99f6e4" />
  <text x="872" y="373" text-anchor="middle" class="font-mono" font-size="10.5" font-weight="600" fill="#0f766e">Optional NIC2: Host-Only / NatNet</text>
  <text x="872" y="390" text-anchor="middle" class="font-mono" font-size="9.5" fill="#115e59">VM-to-VM cluster east-west traffic</text>

  <!-- Arrow between NAT Engine and Guest NIC1 -->
  <line x1="872" y1="452" x2="872" y2="416" stroke="#0284c7" stroke-width="2.25" marker-end="url(#arrow-sky)" />

  <!-- Bottom NAT Engine Bar -->
  <rect x="454" y="454" width="564" height="72" rx="8" fill="#0f172a" />
  <text x="736" y="479" text-anchor="middle" class="font-sans" font-size="13.5" font-weight="700" fill="#f8fafc">VirtualBox Built-In NAT Engine (Gateway 10.0.2.2 · DNS 10.0.2.3)</text>
  <text x="736" y="502" text-anchor="middle" class="font-mono" font-size="11" fill="#38bdf8">Rule "ssh": tcp · Host 127.0.0.1:2222 ──► Guest [10.0.2.15]:22 | Outbound Internet Allowed</text>
</svg>
