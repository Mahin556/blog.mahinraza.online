<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="530" viewBox="0 0 1080 530" role="img" aria-labelledby="title-vag-up desc-vag-up">
  <title id="title-vag-up">Vagrant Up Execution Pipeline</title>
  <desc id="desc-vag-up">Six-stage workflow showing what happens under the hood when running vagrant up: parsing the Vagrantfile, fetching or reusing the cached box, cloning the virtual machine via the provider, configuring virtual networking, booting and injecting SSH keys plus synced folders, and executing provisioners.</desc>

  <defs>
    <style>
      .font-sans { font-family: Inter, 'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0d9488" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="1080" height="530" rx="16" fill="#f8fafc" />
  <rect x="1" y="1" width="1078" height="528" rx="15" fill="none" stroke="#e2e8f0" stroke-width="2" />

  <!-- Top Header -->
  <text x="40" y="42" class="font-mono" font-size="12" font-weight="600" fill="#0f766e" letter-spacing="0.08em">// EXECUTION PIPELINE</text>
  <text x="40" y="70" class="font-sans" font-size="22" font-weight="700" fill="#0f172a">What Happens Under the Hood During "vagrant up"</text>

  <!-- Command Badge Top-Right -->
  <rect x="856" y="38" width="184" height="34" rx="8" fill="#0f172a" />
  <text x="948" y="60" text-anchor="middle" class="font-mono" font-size="13" font-weight="700" fill="#5eead4">$ vagrant up</text>

  <!-- ========================================================= -->
  <!-- ROW 1: Steps 01 -> 02 -> 03                               -->
  <!-- ========================================================= -->

  <!-- STEP 01 -->
  <rect x="40" y="102" width="308" height="164" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.75" />
  <rect x="40" y="102" width="308" height="42" rx="12" fill="#f0fdfa" />
  <rect x="40" y="132" width="308" height="12" fill="#f0fdfa" />
  <line x1="40" y1="144" x2="348" y2="144" stroke="#99f6e4" stroke-width="1.25" />
  <rect x="56" y="112" width="54" height="22" rx="6" fill="#0f766e" />
  <text x="83" y="127" text-anchor="middle" class="font-mono" font-size="11" font-weight="700" fill="#ffffff">STEP 1</text>
  <text x="122" y="128" class="font-sans" font-size="14" font-weight="700" fill="#0f172a">Parse Vagrantfile</text>

  <text x="58" y="170" class="font-sans" font-size="12.5" fill="#334155">Evaluates Ruby DSL configuration</text>
  <text x="58" y="190" class="font-sans" font-size="12.5" fill="#334155">and resolves target box, CPU/RAM,</text>
  <text x="58" y="210" class="font-sans" font-size="12.5" fill="#334155">networking, and provisioners.</text>
  <rect x="58" y="226" width="272" height="26" rx="5" fill="#f1f5f9" />
  <text x="194" y="243" text-anchor="middle" class="font-mono" font-size="10.5" fill="#0f766e">Vagrant.configure("2")</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="348" y1="184" x2="380" y2="184" stroke="#0d9488" stroke-width="2.25" marker-end="url(#arrow-teal)" />

  <!-- STEP 02 -->
  <rect x="386" y="102" width="308" height="164" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.75" />
  <rect x="386" y="102" width="308" height="42" rx="12" fill="#f0fdfa" />
  <rect x="386" y="132" width="308" height="12" fill="#f0fdfa" />
  <line x1="386" y1="144" x2="694" y2="144" stroke="#99f6e4" stroke-width="1.25" />
  <rect x="402" y="112" width="54" height="22" rx="6" fill="#0f766e" />
  <text x="429" y="127" text-anchor="middle" class="font-mono" font-size="11" font-weight="700" fill="#ffffff">STEP 2</text>
  <text x="468" y="128" class="font-sans" font-size="14" font-weight="700" fill="#0f172a">Fetch &amp; Cache Box</text>

  <text x="404" y="170" class="font-sans" font-size="12.5" fill="#334155">Checks global box cache first;</text>
  <text x="404" y="190" class="font-sans" font-size="12.5" fill="#334155">downloads the .box image once</text>
  <text x="404" y="210" class="font-sans" font-size="12.5" fill="#334155">from HCP Registry if missing.</text>
  <rect x="404" y="226" width="272" height="26" rx="5" fill="#f1f5f9" />
  <text x="540" y="243" text-anchor="middle" class="font-mono" font-size="10.5" fill="#0f766e">~/.vagrant.d/boxes/</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="694" y1="184" x2="726" y2="184" stroke="#0d9488" stroke-width="2.25" marker-end="url(#arrow-teal)" />

  <!-- STEP 03 -->
  <rect x="732" y="102" width="308" height="164" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.75" />
  <rect x="732" y="102" width="308" height="42" rx="12" fill="#f0fdfa" />
  <rect x="732" y="132" width="308" height="12" fill="#f0fdfa" />
  <line x1="732" y1="144" x2="1040" y2="144" stroke="#99f6e4" stroke-width="1.25" />
  <rect x="748" y="112" width="54" height="22" rx="6" fill="#0f766e" />
  <text x="775" y="127" text-anchor="middle" class="font-mono" font-size="11" font-weight="700" fill="#ffffff">STEP 3</text>
  <text x="814" y="128" class="font-sans" font-size="14" font-weight="700" fill="#0f172a">Clone Base Image</text>

  <text x="750" y="170" class="font-sans" font-size="12.5" fill="#334155">Calls provider CLI to import disk</text>
  <text x="750" y="190" class="font-sans" font-size="12.5" fill="#334155">(VDI / QCOW2) and allocate</text>
  <text x="750" y="210" class="font-sans" font-size="12.5" fill="#334155">configured vCPUs and vRAM.</text>
  <rect x="750" y="226" width="272" height="26" rx="5" fill="#f1f5f9" />
  <text x="886" y="243" text-anchor="middle" class="font-mono" font-size="10.5" fill="#0f766e">VBoxManage import / clonevm</text>

  <!-- Connector Path: Step 3 -> Step 4 -->
  <path d="M 886 266 L 886 292 L 194 292 L 194 314" fill="none" stroke="#0d9488" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow-teal)" />

  <!-- ========================================================= -->
  <!-- ROW 2: Steps 04 -> 05 -> 06                               -->
  <!-- ========================================================= -->

  <!-- STEP 04 -->
  <rect x="40" y="320" width="308" height="168" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.75" />
  <rect x="40" y="320" width="308" height="42" rx="12" fill="#f0fdfa" />
  <rect x="40" y="350" width="308" height="12" fill="#f0fdfa" />
  <line x1="40" y1="362" x2="348" y2="362" stroke="#99f6e4" stroke-width="1.25" />
  <rect x="56" y="330" width="54" height="22" rx="6" fill="#0f766e" />
  <text x="83" y="345" text-anchor="middle" class="font-mono" font-size="11" font-weight="700" fill="#ffffff">STEP 4</text>
  <text x="122" y="346" class="font-sans" font-size="14" font-weight="700" fill="#0f172a">Wire Virtual Network</text>

  <text x="58" y="388" class="font-sans" font-size="12.5" fill="#334155">Attaches NAT adapter for SSH</text>
  <text x="58" y="408" class="font-sans" font-size="12.5" fill="#334155">(2222→22), host-only private</text>
  <text x="58" y="428" class="font-sans" font-size="12.5" fill="#334155">IPs, and custom port forwards.</text>
  <rect x="58" y="446" width="272" height="26" rx="5" fill="#f1f5f9" />
  <text x="194" y="463" text-anchor="middle" class="font-mono" font-size="10.5" fill="#0f766e">127.0.0.1:2222 · 192.168.56.x</text>

  <!-- Arrow 4 -> 5 -->
  <line x1="348" y1="404" x2="380" y2="404" stroke="#0d9488" stroke-width="2.25" marker-end="url(#arrow-teal)" />

  <!-- STEP 05 -->
  <rect x="386" y="320" width="308" height="168" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.75" />
  <rect x="386" y="320" width="308" height="42" rx="12" fill="#f0fdfa" />
  <rect x="386" y="350" width="308" height="12" fill="#f0fdfa" />
  <line x1="386" y1="362" x2="694" y2="362" stroke="#99f6e4" stroke-width="1.25" />
  <rect x="402" y="330" width="54" height="22" rx="6" fill="#0f766e" />
  <text x="429" y="345" text-anchor="middle" class="font-mono" font-size="11" font-weight="700" fill="#ffffff">STEP 5</text>
  <text x="468" y="346" class="font-sans" font-size="14" font-weight="700" fill="#0f172a">Boot, SSH &amp; Mount</text>

  <text x="404" y="388" class="font-sans" font-size="12.5" fill="#334155">Boots Guest OS, rotates insecure</text>
  <text x="404" y="408" class="font-sans" font-size="12.5" fill="#334155">default key to a unique SSH key,</text>
  <text x="404" y="428" class="font-sans" font-size="12.5" fill="#334155">and mounts synced folder.</text>
  <rect x="404" y="446" width="272" height="26" rx="5" fill="#f1f5f9" />
  <text x="540" y="463" text-anchor="middle" class="font-mono" font-size="10.5" fill="#0f766e">Host ./ ↔ Guest /vagrant</text>

  <!-- Arrow 5 -> 6 -->
  <line x1="694" y1="404" x2="726" y2="404" stroke="#0d9488" stroke-width="2.25" marker-end="url(#arrow-teal)" />

  <!-- STEP 06 (Highlighted Final Ready State) -->
  <rect x="732" y="320" width="308" height="168" rx="12" fill="#ffffff" stroke="#0d9488" stroke-width="2.25" />
  <rect x="732" y="320" width="308" height="42" rx="12" fill="#ccfbf1" />
  <rect x="732" y="350" width="308" height="12" fill="#ccfbf1" />
  <line x1="732" y1="362" x2="1040" y2="362" stroke="#5eead4" stroke-width="1.5" />
  <rect x="748" y="330" width="54" height="22" rx="6" fill="#115e59" />
  <text x="775" y="345" text-anchor="middle" class="font-mono" font-size="11" font-weight="700" fill="#ffffff">STEP 6</text>
  <text x="814" y="346" class="font-sans" font-size="14" font-weight="700" fill="#0f766e">Run Provisioners</text>

  <text x="750" y="388" class="font-sans" font-size="12.5" fill="#334155">Executes Shell scripts, Ansible</text>
  <text x="750" y="408" class="font-sans" font-size="12.5" fill="#334155">playbooks, or package installs.</text>
  <text x="750" y="428" class="font-sans" font-size="12.5" font-weight="600" fill="#0f766e">Environment ready for SSH!</text>
  <rect x="750" y="446" width="272" height="26" rx="5" fill="#0f172a" />
  <text x="886" y="463" text-anchor="middle" class="font-mono" font-size="11" font-weight="600" fill="#5eead4">$ vagrant ssh</text>
</svg>
