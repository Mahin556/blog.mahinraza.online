<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img" aria-labelledby="title-vag-arch desc-vag-arch">
  <title id="title-vag-arch">Vagrant Architecture: Declarative VM Automation</title>
  <desc id="desc-vag-arch">Architecture diagram showing how a Vagrantfile and the Vagrant CLI pull base boxes from the HCP Vagrant Registry into a local cache and instruct a hypervisor provider like VirtualBox or KVM to create, network, mount synced folders, and provision isolated guest virtual machines.</desc>

  <defs>
    <style>
      .font-sans { font-family: Inter, 'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0d9488" />
    </marker>
    <marker id="arrow-sky" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="1080" height="600" rx="16" fill="#f8fafc" />
  <rect x="1" y="1" width="1078" height="598" rx="15" fill="none" stroke="#e2e8f0" stroke-width="2" />

  <!-- Top Header -->
  <text x="40" y="42" class="font-mono" font-size="12" font-weight="600" fill="#0f766e" letter-spacing="0.08em">// VAGRANT ARCHITECTURE</text>
  <text x="40" y="70" class="font-sans" font-size="22" font-weight="700" fill="#0f172a">How Vagrant Orchestrates Reproducible Virtual Machines</text>

  <!-- ========================================================= -->
  <!-- LEFT COLUMN: Blueprint, CLI Engine & Box Registry         -->
  <!-- ========================================================= -->

  <!-- Card 1: Project Blueprint -->
  <rect x="40" y="96" width="330" height="190" rx="12" fill="#ffffff" stroke="#0d9488" stroke-width="1.75" />
  <rect x="40" y="96" width="330" height="40" rx="12" fill="#f0fdfa" />
  <rect x="40" y="124" width="330" height="12" fill="#f0fdfa" />
  <line x1="40" y1="136" x2="370" y2="136" stroke="#99f6e4" stroke-width="1.25" />
  <text x="58" y="121" class="font-sans" font-size="14" font-weight="700" fill="#0f766e">1. Project Directory (Git Repo)</text>

  <!-- Vagrantfile Code Block -->
  <rect x="58" y="150" width="294" height="78" rx="8" fill="#0f172a" />
  <text x="74" y="173" class="font-mono" font-size="12" font-weight="700" fill="#5eead4">Vagrantfile (Ruby DSL)</text>
  <text x="74" y="194" class="font-mono" font-size="10.5" fill="#e2e8f0">config.vm.box = "bento/ubuntu-24.04"</text>
  <text x="74" y="213" class="font-mono" font-size="10.5" fill="#94a3b8">cpus · memory · network · provision</text>

  <!-- .vagrant State Strip -->
  <rect x="58" y="240" width="294" height="32" rx="6" fill="#f1f5f9" stroke="#cbd5e1" />
  <text x="205" y="260" text-anchor="middle" class="font-mono" font-size="10.5" font-weight="500" fill="#334155">.vagrant/ → Machine IDs &amp; SSH Keys</text>

  <!-- Arrow: Blueprint -> CLI -->
  <line x1="205" y1="286" x2="205" y2="322" stroke="#0d9488" stroke-width="2" marker-end="url(#arrow-teal)" />
  <rect x="115" y="294" width="180" height="20" rx="10" fill="#ccfbf1" />
  <text x="205" y="308" text-anchor="middle" class="font-mono" font-size="10" font-weight="600" fill="#115e59">vagrant up · ssh · destroy</text>

  <!-- Card 2: Vagrant CLI Core -->
  <rect x="40" y="328" width="330" height="74" rx="12" fill="#0f766e" />
  <text x="205" y="358" text-anchor="middle" class="font-sans" font-size="15.5" font-weight="700" fill="#ffffff">2. Vagrant CLI Engine</text>
  <text x="205" y="381" text-anchor="middle" class="font-mono" font-size="10.5" fill="#ccfbf1">DSL Parser · SSH Manager · Provider API</text>

  <!-- Arrow: CLI <-> Box Cache -->
  <line x1="205" y1="430" x2="205" y2="406" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-sky)" />

  <!-- Card 3: Box Registry & Cache -->
  <rect x="40" y="432" width="330" height="132" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <rect x="40" y="432" width="330" height="36" rx="12" fill="#f1f5f9" />
  <rect x="40" y="456" width="330" height="12" fill="#f1f5f9" />
  <line x1="40" y1="468" x2="370" y2="468" stroke="#cbd5e1" stroke-width="1" />
  <text x="58" y="455" class="font-sans" font-size="13.5" font-weight="700" fill="#1e293b">3. Base Box Registry &amp; Cache</text>

  <rect x="58" y="478" width="294" height="36" rx="6" fill="#e0f2fe" stroke="#7dd3fc" />
  <text x="205" y="494" text-anchor="middle" class="font-sans" font-size="11.5" font-weight="700" fill="#0369a1">HCP Vagrant Registry (Cloud Catalog)</text>
  <text x="205" y="508" text-anchor="middle" class="font-mono" font-size="9.5" fill="#0284c7">bento/ubuntu-24.04 · rockylinux/9</text>

  <rect x="58" y="520" width="294" height="32" rx="6" fill="#f8fafc" stroke="#94a3b8" />
  <text x="205" y="540" text-anchor="middle" class="font-mono" font-size="10.5" font-weight="600" fill="#334155">Cache: ~/.vagrant.d/boxes (Reused)</text>

  <!-- Connector Arrow: CLI -> Provider Layer -->
  <line x1="370" y1="368" x2="412" y2="368" stroke="#0d9488" stroke-width="2.25" marker-end="url(#arrow-teal)" />

  <!-- ========================================================= -->
  <!-- RIGHT PANEL: Host System, Provider & Provisioned VMs      -->
  <!-- ========================================================= -->
  <rect x="398" y="96" width="642" height="468" rx="12" fill="#ffffff" stroke="#0d9488" stroke-width="2" />
  <rect x="398" y="96" width="642" height="40" rx="12" fill="#f0fdfa" />
  <rect x="398" y="124" width="642" height="12" fill="#f0fdfa" />
  <line x1="398" y1="136" x2="1040" y2="136" stroke="#99f6e4" stroke-width="1.5" />
  <text x="420" y="121" class="font-sans" font-size="14.5" font-weight="700" fill="#0f766e">4. Automated Virtual Environment on Host</text>
  <rect x="876" y="105" width="144" height="22" rx="11" fill="#ccfbf1" stroke="#14b8a6" />
  <text x="948" y="120" text-anchor="middle" class="font-mono" font-size="10.5" font-weight="600" fill="#115e59">Reproducible Lab</text>

  <!-- Guest VM 1 (Primary) -->
  <rect x="418" y="152" width="292" height="168" rx="8" fill="#f8fafc" stroke="#14b8a6" stroke-width="1.75" />
  <rect x="418" y="152" width="292" height="28" rx="8" fill="#0f766e" />
  <rect x="418" y="170" width="292" height="10" fill="#0f766e" />
  <text x="564" y="170" text-anchor="middle" class="font-mono" font-size="11.5" font-weight="600" fill="#ffffff">Guest VM 1: dev-box (Ubuntu 24.04)</text>

  <rect x="432" y="190" width="264" height="28" rx="5" fill="#ecfdf5" stroke="#6ee7b7" />
  <text x="564" y="208" text-anchor="middle" class="font-sans" font-size="11.5" font-weight="600" fill="#065f46">Provisioner: Shell / Ansible (NGINX)</text>

  <rect x="432" y="224" width="264" height="28" rx="5" fill="#e0f2fe" stroke="#7dd3fc" />
  <text x="564" y="242" text-anchor="middle" class="font-mono" font-size="11" font-weight="600" fill="#0369a1">Synced Folder: Host ./ ↔ /vagrant</text>

  <rect x="432" y="258" width="264" height="28" rx="5" fill="#f1f5f9" stroke="#cbd5e1" />
  <text x="564" y="276" text-anchor="middle" class="font-mono" font-size="10.5" fill="#334155">SSH :2222 · 8080→80 · 192.168.56.10</text>

  <text x="564" y="307" text-anchor="middle" class="font-mono" font-size="10" fill="#64748b">2 vCPU · 2048 MB vRAM · Passwordless SSH</text>

  <!-- Guest VM 2..N (Multi-Machine Capability) -->
  <rect x="728" y="152" width="292" height="168" rx="8" fill="#f8fafc" stroke="#14b8a6" stroke-width="1.5" stroke-dasharray="5,4" />
  <rect x="728" y="152" width="292" height="28" rx="8" fill="#115e59" />
  <rect x="728" y="170" width="292" height="10" fill="#115e59" />
  <text x="874" y="170" text-anchor="middle" class="font-mono" font-size="11.5" font-weight="600" fill="#ffffff">Guest VM 2..N (Multi-Machine)</text>

  <rect x="742" y="190" width="264" height="28" rx="5" fill="#ecfdf5" stroke="#6ee7b7" />
  <text x="874" y="208" text-anchor="middle" class="font-sans" font-size="11.5" font-weight="600" fill="#065f46">Database / Kubeadm Worker Nodes</text>

  <rect x="742" y="224" width="264" height="28" rx="5" fill="#e0f2fe" stroke="#7dd3fc" />
  <text x="874" y="242" text-anchor="middle" class="font-mono" font-size="11" font-weight="600" fill="#0369a1">Shared Artifacts via /vagrant</text>

  <rect x="742" y="258" width="264" height="28" rx="5" fill="#f1f5f9" stroke="#cbd5e1" />
  <text x="874" y="276" text-anchor="middle" class="font-mono" font-size="10.5" fill="#334155">Private Subnet: 192.168.56.11+</text>

  <text x="874" y="307" text-anchor="middle" class="font-mono" font-size="10" fill="#64748b">Optional multi-node topology in 1 file</text>

  <!-- Arrows from Guest VMs to Provider -->
  <line x1="564" y1="320" x2="564" y2="336" stroke="#0d9488" stroke-width="1.75" marker-end="url(#arrow-teal)" />
  <line x1="874" y1="320" x2="874" y2="336" stroke="#0d9488" stroke-width="1.75" marker-end="url(#arrow-teal)" />

  <!-- Provider Layer -->
  <rect x="418" y="340" width="602" height="58" rx="8" fill="#0284c7" />
  <text x="719" y="364" text-anchor="middle" class="font-sans" font-size="14.5" font-weight="700" fill="#ffffff">Provider Layer (Hypervisor / Container Runtime)</text>
  <text x="719" y="385" text-anchor="middle" class="font-mono" font-size="11" fill="#e0f2fe">Oracle VirtualBox · Linux KVM (libvirt) · VMware · Hyper-V · Docker</text>

  <!-- Host Operating System -->
  <rect x="418" y="410" width="602" height="58" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5" />
  <text x="719" y="434" text-anchor="middle" class="font-sans" font-size="14" font-weight="700" fill="#0f172a">Host Operating System (Linux · macOS · Windows)</text>
  <text x="719" y="454" text-anchor="middle" class="font-mono" font-size="10.5" fill="#475569">Code Editor / IDE · Terminal · Git · Browser (http://127.0.0.1:8080)</text>

  <!-- Physical Host Hardware -->
  <rect x="418" y="480" width="602" height="68" rx="8" fill="#0f172a" />
  <text x="719" y="506" text-anchor="middle" class="font-sans" font-size="14" font-weight="700" fill="#f8fafc">Physical Host Hardware (Intel VT-x · AMD-V · Apple Silicon)</text>
  <text x="719" y="528" text-anchor="middle" class="font-mono" font-size="11" fill="#5eead4">Physical CPU Cores · System RAM · Local NVMe SSD · Host NIC</text>
</svg>
